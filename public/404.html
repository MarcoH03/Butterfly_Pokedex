<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mariposas de Cuba</title>
    <script>
      // GitHub Pages SPA redirect
      // Saves the full URL then redirects to the root index.html
      // The app picks up sessionStorage.redirect on load and navigates there
      var l = window.location;
      sessionStorage.redirect = l.href;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 2).join('/') + '/?p=' +
        l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
</html>
