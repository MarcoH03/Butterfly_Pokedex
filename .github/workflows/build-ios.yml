name: Compilar app nativa de iOS

# GitHub solo permite disparar "workflow_dispatch" a mano desde la
# pestaña Actions una vez que el archivo del workflow ya existe en
# la rama por defecto (main). Mientras esta rama no se una a main,
# se dispara con cada push que toque ios/ o este mismo archivo; el
# botón "Run workflow" queda disponible después del merge.
on:
  workflow_dispatch:
  push:
    branches: [claude/ios-native-app-9n0hlj]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Versión de Xcode disponible
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Compilar sin firmar (para producir el .ipa)
        run: |
          set -euo pipefail
          cd ios
          xcodebuild \
            -project MariposasDeCuba.xcodeproj \
            -scheme MariposasDeCuba \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Empaquetar el .ipa (sin firmar — Sideloadly/AltStore lo firman al instalar)
        run: |
          set -euo pipefail
          cd ios/build/Build/Products/Release-iphoneos
          ls -la
          APP_DIR=$(find . -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "No se encontró ningún .app en Release-iphoneos" >&2
            exit 1
          fi
          echo "Empaquetando $APP_DIR"
          rm -rf Payload MariposasDeCuba-sin-firmar.ipa
          mkdir -p Payload
          cp -R "$APP_DIR" Payload/
          # Quita atributos extendidos (cuarentena, procedencia…) que
          # macOS añade al copiar — si quedan, "zip" los guarda como
          # entradas AppleDouble (__MACOSX/, ._*) dentro del .ipa, y
          # eso es justo lo que hace que Sideloadly/AltStore lo
          # rechacen con un "Invalid file" al intentar reinstalarlo.
          xattr -cr Payload
          # ditto empaqueta sin ese metadato de más — es lo mismo que
          # usa "xcodebuild -exportArchive" por debajo para generar
          # un .ipa de verdad.
          ditto -c -k --keepParent Payload MariposasDeCuba-sin-firmar.ipa
          mkdir -p "$GITHUB_WORKSPACE/artefactos"
          cp MariposasDeCuba-sin-firmar.ipa "$GITHUB_WORKSPACE/artefactos/"

      - name: Subir el .ipa como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MariposasDeCuba-ipa
          path: artefactos/MariposasDeCuba-sin-firmar.ipa
          retention-days: 60

      - name: Elegir un simulador de iPhone disponible
        run: |
          set -euo pipefail
          DEVICE_ID=$(python3 ios/ci/elegir_simulador.py)
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          echo "Usando simulador: $DEVICE_ID"

      - name: Compilar para el simulador
        run: |
          set -euo pipefail
          cd ios
          xcodebuild \
            -project MariposasDeCuba.xcodeproj \
            -scheme MariposasDeCuba \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build-sim \
            -destination "id=$DEVICE_ID" \
            build

      - name: Arrancar el simulador, instalar y capturar pantallas
        run: |
          set -euo pipefail
          mkdir -p capturas
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP_PATH=$(find ios/build-sim/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          BUNDLE_ID="com.marcoh03.mariposasdecuba"

          xcrun simctl ui "$DEVICE_ID" appearance light
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          sleep 4
          xcrun simctl io "$DEVICE_ID" screenshot capturas/catalogo-light.png
          xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID" || true

          xcrun simctl ui "$DEVICE_ID" appearance dark
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          sleep 4
          xcrun simctl io "$DEVICE_ID" screenshot capturas/catalogo-dark.png

      - name: Subir las capturas
        uses: actions/upload-artifact@v4
        with:
          name: capturas-simulador
          path: capturas/*.png
          retention-days: 60

  build-signed:
    runs-on: macos-14
    # No depende de "build": si algo se rompe aquí, el .ipa sin firmar
    # sigue publicándose igual.
    steps:
      - uses: actions/checkout@v4

      - name: Versión de Xcode y fastlane
        run: |
          xcodebuild -version
          fastlane --version

      - name: Actualizar fastlane
        # El runner trae 2.238.0, con un bug conocido en
        # itc_service_key que confunde un error local de caché con
        # un fallo del servidor de Apple ("Could not receive latest
        # API key…", visto en fastlane/fastlane#30199). Corregido en
        # versiones más recientes.
        run: gem install fastlane --no-document && fastlane --version

      - name: Compilar .ipa firmado con el Apple ID gratis del usuario
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # UDID del iPhone donde se va a instalar — no es un dato
          # sensible (no sirve para nada sin el propio teléfono), así
          # que va fijo aquí en vez de como secreto.
          DEVICE_UDID: "00008120-0006108C0C00C01E"
        run: |
          set -euo pipefail
          cd ios
          fastlane build_signed

      - name: Subir el .ipa firmado
        uses: actions/upload-artifact@v4
        with:
          name: MariposasDeCuba-firmado-ipa
          path: ios/build-signed/MariposasDeCuba-firmado.ipa
          retention-days: 60
