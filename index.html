<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA meta tags — these control how the app behaves on iPhone home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mariposas" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <title>Mariposas de Cuba</title>

    <!--
      Press Start 2P — the canonical pixel/8-bit font used in GBA Pokémon games.
      Loaded from Google Fonts. Once cached by the Service Worker, works offline.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      React mounts into this single <div>.
      Everything you see in the browser is rendered by React into here —
      the HTML file itself is just a shell.
    -->
    <div id="root"></div>

    <!-- Vite injects your built JS bundle here automatically -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
